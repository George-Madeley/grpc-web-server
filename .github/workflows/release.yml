name: Release

on:
  push:
    branches:
      - release

permissions:
  contents: write

jobs:
  release-plz:
    name: Release-plz
    runs-on: ubuntu-latest
    outputs:
      releases: ${{ steps.release.outputs.releases }}
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true # needed so we can push back to `release`
          ref: release

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install release-plz CLI
        uses: taiki-e/install-action@v2
        with:
          tool: release-plz

      - name: Bump versions & changelog (no PR)
        run: release-plz update

      - name: Commit & push version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add -A
            git commit -m "chore: release"
            git push
          fi

      - name: Tag, publish & create GitHub release
        id: release
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  upload-artifacts:
    name: Upload Release Artifacts
    needs: release-plz
    if: needs.release-plz.outputs.releases_created == 'true'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_src: target/x86_64-unknown-linux-gnu/release/grpc-web-server
            binary_dest: grpc-web-server-linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_src: target/x86_64-pc-windows-msvc/release/grpc-web-server.exe
            binary_dest: grpc-web-server-win.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: release

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Compile Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename Binary for Upload (Unix)
        if: matrix.os != 'windows-latest'
        run: cp ${{ matrix.binary_src }} ./${{ matrix.binary_dest }}

      - name: Rename Binary for Upload (Windows)
        if: matrix.os == 'windows-latest'
        run: Copy-Item -Path ${{ matrix.binary_src }} -Destination ./${{ matrix.binary_dest }}

      # release-plz already tagged this exact commit as `v<version>` in the previous job,
      # so we attach binaries to that same tag instead of creating a new release.
      - name: Upload Binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ fromJson(needs.release-plz.outputs.releases)[0].tag }}
          files: ${{ matrix.binary_dest }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
