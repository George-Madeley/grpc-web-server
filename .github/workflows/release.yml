name: Release

on:
  push:
    branches:
      - release

permissions:
  pull-requests: write
  contents: write

jobs:
  # Job 1: Handles Release PR updates or creates the GitHub Release upon PR merge
  release-plz:
    name: Release-plz
    runs-on: ubuntu-latest
    outputs:
      releases: ${{ steps.release-plz.outputs.releases }} # Exposes whether a release occurred
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Important: fetch history so git-cliff can read commits
          ref: release

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Release-plz
        id: release-plz
        uses: release-plz/action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job 2: Builds and uploads artifacts ONLY when a release is actually published
  upload-artifacts:
    name: Upload Release Artifacts
    needs: release-plz
    # Only run if Job 1 actually published a release (i.e. after you merged the Release PR)
    if: ${{ needs.release-plz.outputs.releases != '[]' && needs.release-plz.outputs.releases != '' }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_src: target/x86_64-unknown-linux-gnu/release/grpc-web-server
            binary_dest: grpc-web-server-linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_src: target/x86_64-pc-windows-msvc/release/grpc-web-server.exe
            binary_dest: grpc-web-server-win.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Step 1: Compile the production binary
      - name: Compile Binary
        run: cargo build --release --target ${{ matrix.target }}

      # Step 2: Rename the file so they don't overwrite each other in the release
      - name: Rename Binary for Upload (Unix)
        if: matrix.os != 'windows-latest'
        run: cp ${{ matrix.binary_src }} ./${{ matrix.binary_dest }}

      - name: Rename Binary for Upload (Windows)
        if: matrix.os == 'windows-latest'
        run: Copy-Item -Path ${{ matrix.binary_src }} -Destination ./${{ matrix.binary_dest }}

      # Step 3: Upload the raw file straight to the GitHub release
      - name: Upload Binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Automatically uses the tag created by release-plz
          tag_name: ${{ fromJson(needs.release-plz.outputs.releases)[0].tag }}
          files: ${{ matrix.binary_dest }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
