name: Release

on:
  push:
    branches:
      - release

permissions:
  pull-requests: write
  contents: write

jobs:
  # Job 1: Handles Release PR updates or creates the GitHub Release upon PR merge
  release-plz:
    name: Release-plz
    runs-on: ubuntu-latest
    outputs:
      releases: ${{ steps.release-plz.outputs.releases }} # Exposes whether a release occurred
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Important: fetch history so git-cliff can read commits
          ref: release

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Release-plz
        id: release-plz
        uses: release-plz/action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job 2: Builds and uploads artifacts ONLY when a release is actually published
  upload-artifacts:
    name: Upload Release Artifacts
    needs: release-plz
    # Only run if Job 1 actually published a release (i.e. after you merged the Release PR)
    if: ${{ needs.release-plz.outputs.releases != '[]' && needs.release-plz.outputs.releases != '' }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build and Upload Binary Artifact
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: grpc-web-server # Replace with the exact binary name in Cargo.toml
          target: ${{ matrix.target }}
          token: ${{ secrets.GITHUB_TOKEN }}
