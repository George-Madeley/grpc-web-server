name: Validation

on:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build & format (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Build
        run: cargo build --all-targets --verbose

  cmake:
    name: CMake integration (${{ matrix.os }})
    needs: build
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Configure
        run: cmake --preset "gRPC Web Server (Release)"
      - name: Build
        run: cmake --build --preset "gRPC Web Server (Release)"
